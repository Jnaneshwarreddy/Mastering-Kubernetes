apiVersion: v1
clusters:
  - cluster:
      certificate-authority-data: XXXXXXXXXXX
      server: https://api.cloudk8s.xyz
      tls-server-name: api.internal.cloudk8s.xyz
    name: cloudk8s.xyz
contexts:
  - context:
      cluster: cloudk8s.xyz
      namespace: development
      user: user1
    name: user1-context
current-context: user1-context
kind: Config
users:
  - name: user1
    user:
      client-certificate: /root/user1.crt
      client-key: /root/user1.key
